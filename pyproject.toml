[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "children-media-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pymongo>=4.10,<5", "redis>=5.2,<7", "httpx>=0.28,<1", "pydantic-settings>=2.6,<3", "structlog>=24.4,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "mongomock>=4.3,<5", "fakeredis>=2.26,<3", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["media*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "S110"]
